name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Puppeteer to use System Chrome
        run: |
          CHROME_PATH=$(which google-chrome-stable)
          echo "Using system Chrome at: $CHROME_PATH"
          npm pkg set reactSnap.puppeteerExecutablePath="$CHROME_PATH"

      - name: Build and Pre-render
        run: npm run build

      - name: Push to deploy branch
        run: |
          # Create a clean staging area
          STAGING=$(mktemp -d)
          
          # package.json at root — build command copies _prebuilt to dist
          # This way even if Hostinger wipes dist/ before building, our build recreates it
          cat > "$STAGING/package.json" << 'EOF'
          {
            "scripts": {
              "build": "cp -r _prebuilt dist"
            }
          }
          EOF
          
          # Store pre-rendered files in _prebuilt/ (Hostinger won't touch this)
          cp -r dist "$STAGING/_prebuilt"
          
          # Init git and push
          cd "$STAGING"
          git init -b deploy
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy pre-rendered build from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
          echo "✅ Pushed to deploy branch!"
