name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Puppeteer to use System Chrome
        run: |
          CHROME_PATH=$(which google-chrome-stable)
          echo "Using system Chrome at: $CHROME_PATH"
          npm pkg set reactSnap.puppeteerExecutablePath="$CHROME_PATH"

      - name: Build and Pre-render
        run: npm run build

      # Push the pre-built dist/ to a "deploy" branch.
      # Hostinger watches this branch and deploys from it.
      # Since the files are already built, Hostinger just copies them — no build needed.
      - name: Push to deploy branch
        run: |
          # Create a clean staging area
          mkdir -p /tmp/deploy-staging
          cd /tmp/deploy-staging
          
          # Root-level package.json so Hostinger's "npm run build" succeeds
          echo '{"scripts":{"build":"echo done"}}' > package.json
          
          # Copy the pre-rendered build into dist/ (matches Hostinger's Output directory setting)
          cp -r "$GITHUB_WORKSPACE/dist" ./dist
          
          # Init git and push to deploy branch
          git init -b deploy
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy pre-rendered build from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
          echo "✅ Pushed to deploy branch!"
