name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Puppeteer to use System Chrome
        run: |
          CHROME_PATH=$(which google-chrome-stable)
          echo "Using system Chrome at: $CHROME_PATH"
          npm pkg set reactSnap.puppeteerExecutablePath="$CHROME_PATH"

      - name: Build and Pre-render
        run: npm run build

      # DIAGNOSTIC: List the FTP directory structure to find the correct upload path
      - name: "[DEBUG] Explore FTP directory structure"
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }}" "${{ secrets.FTP_HOST }}" -e "
            echo '=== Current directory (pwd) ===';
            pwd;
            echo '';
            echo '=== Top-level listing (ls) ===';
            ls;
            echo '';
            echo '=== Recursive listing (2 levels deep) ===';
            find . -maxdepth 2 -type d;
            echo '';
            echo '=== Checking public_html ===';
            ls public_html/ 2>/dev/null || echo 'public_html/ does NOT exist at FTP root';
            echo '';
            echo '=== Checking domains/ ===';
            ls domains/ 2>/dev/null || echo 'domains/ does NOT exist at FTP root';
            echo '';
            bye;
          "
