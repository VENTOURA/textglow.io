name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Puppeteer to use System Chrome
        run: |
          CHROME_PATH=$(which google-chrome-stable)
          echo "Using system Chrome at: $CHROME_PATH"
          npm pkg set reactSnap.puppeteerExecutablePath="$CHROME_PATH"

      - name: Build and Pre-render
        run: npm run build

      # DIAGNOSTIC: List the FTP directory structure to find the correct upload path
      - name: "[DEBUG] Explore FTP directory structure"
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1
          lftp -u "${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }}" "${{ secrets.FTP_HOST }}" -e "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            echo '=== Current directory (pwd) ===';
            pwd;
            echo '';
            echo '=== Top-level listing ===';
            cls;
            echo '';
            echo '=== Listing public_html/ ===';
            cls public_html/;
            echo '';
            echo '=== Checking index.html in public_html ===';
            cat public_html/index.html | head -c 300;
            echo '';
            echo '=== Check .ftp-deploy-sync-state.json at root ===';
            cat .ftp-deploy-sync-state.json 2>/dev/null | head -c 200 || echo 'NOT FOUND at root';
            echo '';
            echo '=== Check .ftp-deploy-sync-state.json in public_html ===';
            cat public_html/.ftp-deploy-sync-state.json 2>/dev/null | head -c 200 || echo 'NOT FOUND in public_html';
            bye;
          "
