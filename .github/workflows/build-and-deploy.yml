name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Puppeteer to use System Chrome
        run: |
          CHROME_PATH=$(which google-chrome-stable)
          echo "Using system Chrome at: $CHROME_PATH"
          npm pkg set reactSnap.puppeteerExecutablePath="$CHROME_PATH"

      - name: Build and Pre-render
        run: npm run build

      # Deploy using lftp (mirror) — more reliable than FTP actions with Hostinger's SSL setup
      - name: Deploy to Hostinger via FTP
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1
          echo "Uploading dist/ to public_html/ on Hostinger..."
          lftp -u "${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }}" "${{ secrets.FTP_HOST }}" -e "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            set mirror:parallel-transfer-count 5;
            set mirror:use-pget-n 5;
            mirror --reverse --delete --verbose ./dist/ domains/textglow.io/public_html/;
            bye;
          "
          echo "✅ Upload complete!"

      # Verify the upload actually worked
      - name: Verify deployment
        run: |
          sudo apt-get install -y lftp > /dev/null 2>&1
          echo "=== Reading back index.html from public_html/ ==="
          lftp -u "${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }}" "${{ secrets.FTP_HOST }}" -e "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            cat domains/textglow.io/public_html/index.html | head -c 500;
            echo '';
            echo '=== JS bundle filename on server ===';
            ls domains/textglow.io/public_html/assets/index-*.js;
            bye;
          "
          echo ""
          echo "=== JS bundle in local dist/ ==="
          ls dist/assets/index-*.js
          echo ""
          echo "=== Checking live site ==="
          sleep 5
          curl -s "https://textglow.io/" | grep -o 'src="/assets/index-[^"]*"' || echo "Could not find JS bundle reference"
